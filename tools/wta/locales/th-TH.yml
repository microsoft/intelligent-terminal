connection.reconnecting: "กำลังเชื่อมต่อใหม่..."
# Connecting the pane to WTA's local coordinator process, not to an AI model.
connection.coordinator: "กำลังเชื่อมต่อกับตัวประสานงานภายในเครื่อง..."
