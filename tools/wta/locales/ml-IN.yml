agent_center.console_stale: "നിലവിലെ വസ്തുതകൾ കാലഹരണപ്പെട്ടതാണ്. ഡ്രാഫ്റ്റുകൾ സുരക്ഷിതമാണ്. മാറ്റങ്ങൾ അംഗീകരിക്കുന്നതിനോ അയയ്ക്കുന്നതിനോ മുമ്പ് വീണ്ടും കണക്റ്റ് ചെയ്ത് പുതുക്കുക; അജ്ഞാതമായ ഫലം പരാജയമോ പൂർത്തീകരണമോ അല്ല."
agent_center.console_diagnostics: "ഡയഗ്നോസ്റ്റിക്സിനുള്ള പ്രോട്ടോക്കോൾ വിശദാംശങ്ങൾ (വായിക്കാൻ മാത്രം)"
agent_center.console_no_details: "നിലവിലെ പ്രവർത്തന ഇനത്തിന്റെ വിശദാംശങ്ങളില്ല. പ്രോജക്റ്റ് തിരഞ്ഞെടുക്കാനോ പ്രവർത്തന ഇനം തുറക്കാനോ പുതുക്കാനോ F4 ഉപയോഗിക്കുക." # {Locked="F4"}
