agent_center.console_next_approve: "അടുത്തത്: നിങ്ങൾ സംക്ഷിപ്ത വിവരണം അവലോകനം ചെയ്ത് F4 വഴി കൃത്യമായി നിർദിഷ്ടമായ ആരംഭത്തിന് അംഗീകാരം നൽകുക." # {Locked="F4"}
agent_center.console_next_accept: "അടുത്തത്: മാറ്റമില്ലാതെ ഉറപ്പിച്ച കൈമാറ്റഫലവും തെളിവുകളും പരിശോധിച്ച ശേഷം വ്യക്തമായി സ്വീകരിക്കുക."
agent_center.console_next_attention: "അടുത്തത്: ഈ പ്രവർത്തന ഇനത്തിൽ ശ്രദ്ധ ആവശ്യമുള്ള, തീർപ്പാക്കാത്ത വിഷയങ്ങൾ F4 വഴി അവലോകനം ചെയ്യുക." # {Locked="F4"}
agent_center.console_next_resume: "അടുത്തത്: താൽക്കാലികമായി നിർത്തിയ ഈ പ്രവർത്തന ഇനം എപ്പോൾ പുനരാരംഭിക്കണമെന്ന് നിങ്ങൾ തീരുമാനിക്കുക."
agent_center.console_next_service: "അടുത്തത്: സേവനം അംഗീകരിച്ച പദ്ധതി മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ഇത് അന്തിമ സ്വീകാര്യതയല്ല."
