# Caller telemetry environment and secrets are intentionally not inherited.
name: Native accessibility smoke
on:
  workflow_call:
    inputs:
      head-repository:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      published-sha:
        description: Confirmed repair tip from the trusted worker; admission only, never the scan revision.
        required: false
        default: ''
        type: string
      trusted-repository:
        required: true
        type: string
      trusted-sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
env:
  ACCESSIBILITY_RESULTS: ${{ github.workspace }}/Generated Files/accessibility-${{ github.run_id }}-${{ github.run_attempt }}/native
  ACCESSIBILITY_PAYLOAD: ${{ github.workspace }}/Generated Files/accessibility-${{ github.run_id }}-${{ github.run_attempt }}/testhost-payload
  ACCESSIBILITY_ARCHIVE: ${{ github.workspace }}/Generated Files/accessibility-${{ github.run_id }}-${{ github.run_attempt }}/testhost.zip
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/accessibility-ci-admission
        with:
          published-sha: ${{ inputs.published-sha }}
      - name: Bind native inputs to the admitted original revision
        env:
          HEAD_SHA: ${{ inputs.head-sha }}
          HEAD_REPOSITORY: ${{ inputs.head-repository }}
          TRUSTED_SHA: ${{ inputs.trusted-sha }}
          TRUSTED_REPOSITORY: ${{ inputs.trusted-repository }}
          PULL_REQUEST: ${{ github.event.inputs.pull_request }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node --input-type=module <<'NODE'
          const pr = JSON.parse(process.env.PULL_REQUEST);
          if (process.env.HEAD_SHA !== pr.head.sha ||
              process.env.HEAD_REPOSITORY !== process.env.GITHUB_REPOSITORY ||
              process.env.TRUSTED_REPOSITORY !== process.env.GITHUB_REPOSITORY ||
              process.env.TRUSTED_SHA !== process.env.WORKFLOW_SHA) throw Error('Native input identity differs from admission.');
          NODE
  native-smoke:
    needs: [admission]
    name: Native Axe.Windows smoke
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout immutable trusted consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.trusted-repository }}
          ref: ${{ inputs.trusted-sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/actions/accessibility-ci-admission
            .github/skills/ghaw-pr-security/scripts/security-review.mjs
            build/scripts/ci-accessibility-scope.mjs
            build/scripts/ci-accessibility-payload.py
          sparse-checkout-cone-mode: false
      - name: Verify immutable consumer
        shell: pwsh
        env:
          EXPECTED_TRUSTED_SHA: ${{ inputs.trusted-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:EXPECTED_TRUSTED_SHA) {
            throw 'Consumer checkout does not match the immutable trusted revision.'
          }
      - name: Authenticate exact CI TestHost producer and artifact
        id: payload
        uses: ./.github/actions/accessibility-ci-admission
        with:
          published-sha: ${{ inputs.published-sha }}
          require-payload: 'true'
      - name: Download authenticated artifact without extracting it
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact_digest }}
          PR_NUMBER: ${{ fromJSON(github.event.inputs.pull_request).number }}
          SOURCE_SHA: ${{ inputs.head-sha }}
          CI_RUN_ID: ${{ steps.payload.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.payload.outputs.ci_run_attempt }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const response = await github.rest.actions.downloadArtifact({
              ...context.repo, artifact_id: Number(process.env.ARTIFACT_ID), archive_format: 'zip',
            });
            fs.mkdirSync(path.dirname(process.env.ACCESSIBILITY_ARCHIVE), { recursive: true });
            fs.writeFileSync(process.env.ACCESSIBILITY_ARCHIVE, Buffer.from(response.data), { flag: 'wx' });
            fs.mkdirSync(process.env.ACCESSIBILITY_RESULTS, { recursive: true });
            fs.writeFileSync(path.join(process.env.ACCESSIBILITY_RESULTS, 'ci-payload-provenance.json'),
              JSON.stringify({ repository: `${context.repo.owner}/${context.repo.repo}`,
                pr_number: process.env.PR_NUMBER, source_sha: process.env.SOURCE_SHA, run_id: process.env.CI_RUN_ID,
                run_attempt: process.env.CI_RUN_ATTEMPT, artifact_id: process.env.ARTIFACT_ID,
                digest: process.env.ARTIFACT_DIGEST }));
      - name: Verify archive integrity and complete portable layout before extraction
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
          PR_NUMBER: ${{ fromJSON(github.event.inputs.pull_request).number }}
          CI_RUN_ID: ${{ steps.payload.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.payload.outputs.ci_run_attempt }}
          ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact_digest }}
        run: |
          python build/scripts/ci-accessibility-payload.py extract `
            --archive "$env:ACCESSIBILITY_ARCHIVE" --digest "$env:ARTIFACT_DIGEST" `
            --output "$env:ACCESSIBILITY_PAYLOAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire pinned Axe.Windows CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/microsoft/axe-windows/releases/download/v2.4.2/AxeWindowsCLI-2.4.2.zip'
          $expectedHash = 'AECA43F41C89B3FFB1DB84011539E609ECD7CB3BADD6E78FADA2ADA327D10A64'
          $zip = Join-Path $env:RUNNER_TEMP 'AxeWindowsCLI-2.4.2.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actualHash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Axe.Windows archive hash mismatch: $actualHash"
          }
          $destination = Join-Path $env:RUNNER_TEMP 'axe-windows'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          "AXE_WINDOWS_PATH=$(Join-Path $destination 'AxeWindowsCLI.exe')" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Checkout trusted native harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.trusted-repository }}
          ref: ${{ inputs.trusted-sha }}
          path: trusted-accessibility
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            test/accessibility
            build/scripts/Get-DependenciesFromAppxRecipe.ps1
          sparse-checkout-cone-mode: false
      - name: Verify immutable trusted harness
        shell: pwsh
        env:
          EXPECTED_TRUSTED_SHA: ${{ inputs.trusted-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_TRUSTED_SHA -notmatch '\A[0-9a-fA-F]{40}\z') {
            throw 'Trusted harness revision must be an exact 40-character commit SHA.'
          }
          $actual = git --no-replace-objects -c core.fsmonitor=false -C trusted-accessibility rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_TRUSTED_SHA) {
            throw 'Trusted harness checkout does not match the immutable revision.'
          }
      - name: Install test host framework dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:ACCESSIBILITY_PAYLOAD
          $recipe = 'TestHostApp.build.appxrecipe'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'trusted-accessibility\build\scripts\Get-DependenciesFromAppxRecipe.ps1'
          $dependencies = @(& $helper -Path $recipe)
          if ($dependencies.Count -eq 0) {
            throw 'The test host recipe contains no framework dependencies.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedFrameworks = @('Microsoft.UI.Xaml.2.8', 'Microsoft.VCLibs.140.00.Debug')
          $expectedPublisher = 'CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US'
          foreach ($dependency in $dependencies) {
            $archive = [IO.Compression.ZipFile]::OpenRead($dependency.FullName)
            try {
              $entry = $archive.GetEntry('AppxManifest.xml')
              if (-not $entry) { throw "Framework package has no manifest: $dependency" }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { [xml]$framework = $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $archive.Dispose() }
            $identity = $framework.Package.Identity
            if ($identity.Name -notin $expectedFrameworks -or
                $identity.Publisher -ne $expectedPublisher -or
                $identity.ProcessorArchitecture -ne 'x64' -or
                -not [Xml.XmlConvert]::ToBoolean([string]$framework.Package.Properties.Framework)) {
              throw "Recipe dependency is not an expected Microsoft x64 test host framework: $dependency"
            }
            $installed = @(Get-AppxPackage -Name $identity.Name | Where-Object {
              $_.Architecture -eq $identity.ProcessorArchitecture -and
              [version]$_.Version -ge [version]$identity.Version -and
              $_.Publisher -eq $identity.Publisher
            })
            if ($installed.Count -gt 0) { continue }
            Add-AppxPackage -Path $dependency.FullName -ErrorAction Stop
          }
      - name: Scan FRE
        id: fre
        continue-on-error: true
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.head-sha }}
        run: |
          & trusted-accessibility\test\accessibility\Invoke-AxeWindowsTestHost.ps1 `
            -Surface fre `
            -ManifestPath "$env:ACCESSIBILITY_PAYLOAD/app/AppxManifest.xml" `
            -AxePath $env:AXE_WINDOWS_PATH `
            -OutputDirectory "$env:ACCESSIBILITY_RESULTS" `
            -SourceSha $env:SOURCE_SHA
      - name: Scan Agents settings
        id: agents
        continue-on-error: true
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.head-sha }}
        run: |
          & trusted-accessibility\test\accessibility\Invoke-AxeWindowsTestHost.ps1 `
            -Surface agents `
            -ManifestPath "$env:ACCESSIBILITY_PAYLOAD/app/AppxManifest.xml" `
            -AxePath $env:AXE_WINDOWS_PATH `
            -OutputDirectory "$env:ACCESSIBILITY_RESULTS" `
            -SourceSha $env:SOURCE_SHA
      - name: Scan FRE settings
        id: fre-settings
        continue-on-error: true
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.head-sha }}
        run: |
          & trusted-accessibility\test\accessibility\Invoke-AxeWindowsTestHost.ps1 `
            -Surface fre-settings `
            -ManifestPath "$env:ACCESSIBILITY_PAYLOAD/app/AppxManifest.xml" `
            -AxePath $env:AXE_WINDOWS_PATH `
            -OutputDirectory "$env:ACCESSIBILITY_RESULTS" `
            -SourceSha $env:SOURCE_SHA
      - name: Upload native accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-accessibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ACCESSIBILITY_RESULTS }}
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce native scan results
        if: always()
        shell: pwsh
        env:
          FRE_OUTCOME: ${{ steps.fre.outcome }}
          AGENTS_OUTCOME: ${{ steps.agents.outcome }}
          FRE_SETTINGS_OUTCOME: ${{ steps.fre-settings.outcome }}
          SOURCE_SHA: ${{ inputs.head-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FRE_OUTCOME -ne 'success' -or $env:AGENTS_OUTCOME -ne 'success' -or $env:FRE_SETTINGS_OUTCOME -ne 'success') {
            throw "Native accessibility scan failed or was blocked: FRE=$env:FRE_OUTCOME Agents=$env:AGENTS_OUTCOME FRE-settings=$env:FRE_SETTINGS_OUTCOME"
          }
          $markers = @{ fre = 'NextButton'; 'fre-settings' = 'AgentComboBox'; agents = 'AcpAgentComboBox' }
          foreach ($surface in @('fre', 'fre-settings', 'agents')) {
            $directory = Join-Path $env:ACCESSIBILITY_RESULTS $surface
            $result = Get-Content -LiteralPath (Join-Path $directory 'result.json') -Raw | ConvertFrom-Json
            if ($result.status -ne 'PASS' -or $result.source_sha -ne $env:SOURCE_SHA -or
                $result.surface -ne $surface -or $result.process_id -le 0) {
              throw "Native $surface result has missing or inconsistent identity/status evidence."
            }
            $scanPath = Join-Path $directory 'axe-results.json'
            $treePath = Join-Path $directory 'uia-tree.json'
            if ($result.axe_results -ne $scanPath) { throw "Native $surface scan path is inconsistent." }
            $scan = Get-Content -LiteralPath $scanPath -Raw | ConvertFrom-Json
            if ($scan.scan_id -ne $surface -or $scan.process_id -ne $result.process_id -or
                $scan.window_count -le 0 -or $scan.error_count -ne 0 -or
                $scan.visible_state_marker -ne $markers[$surface] -or $scan.uia_tree -ne $treePath) {
              throw "Native $surface scan has missing or inconsistent state evidence."
            }
            $tree = @(Get-Content -LiteralPath $treePath -Raw | ConvertFrom-Json)
            $visibleMarker = @($tree | Where-Object {
              $_.automation_id -eq $markers[$surface] -and
              $_.is_offscreen -eq $false -and $_.process_id -eq $result.process_id
            })
            if ($visibleMarker.Count -eq 0) { throw "Native $surface hierarchy lacks its visible state marker." }
          }
