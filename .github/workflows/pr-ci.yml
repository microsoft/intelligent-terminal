name: PR CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'installer/**'
      - 'build/**'
      - 'dep/**'
      - 'oss/**'
      - 'res/**'
      - '.cargo/**'
      - '.github/workflows/pr-ci.yml'
      - '.github/workflows/pr-ci-native.yml'
      - '*.props'
      - '*.targets'
      - '*.sln*'
      - 'NuGet.Config'
      - 'vcpkg.json'
      - 'dirs'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance_base_sha:
        description: 'Immutable ancestor used to exercise real production performance scope'
        required: false
        type: string
      run_unit_tests:
        description: 'Execute unit tests during this manual validation'
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/pr-ci-native.yml
    with:
      performance_base_sha: ${{ inputs.performance_base_sha || '' }}
      run_unit_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_unit_tests }}
